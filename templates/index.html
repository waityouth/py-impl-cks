<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SKP Mall Navigation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',sans-serif}
#container{position:relative;width:1024px;height:600px;background:#1a1a2e;overflow:hidden}
canvas{display:block}

/* 覆盖层 */
.overlay{display:none;position:absolute;background:#2a2a3e;border:2px solid #555;border-radius:12px;z-index:100;color:#eee;font-size:14px;padding:16px}
.overlay .close{position:absolute;top:8px;right:8px;background:#e74c3c;color:#fff;border:none;border-radius:6px;padding:4px 14px;cursor:pointer;font-size:13px}

/* 搜索弹窗 */
#searchOverlay{width:750px;height:420px;left:137px;top:90px}
#searchOverlay input{width:100%;padding:10px;font-size:16px;border:none;border-radius:6px;background:#3a3a4e;color:#fff}
#searchResults{margin-top:10px;max-height:320px;overflow-y:auto}
#searchResults .item{padding:8px 14px;background:#3a3a4e;margin:3px 0;border-radius:6px;cursor:pointer;color:#ddd}
#searchResults .item:hover{background:#4a4a5e}

/* 排序弹窗 */
#sortOverlay{width:700px;height:420px;left:162px;top:90px}
.catBtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.catBtns button{padding:8px 16px;border:none;border-radius:6px;background:#a24bc7;color:#fff;cursor:pointer;font-size:14px}
.catBtns button:hover{background:#822ba7}
#sortResults{max-height:300px;overflow-y:auto}
#sortResults .item{padding:8px 14px;background:#3a3a4e;margin:3px 0;border-radius:6px;cursor:pointer;color:#ddd}
#sortResults .item:hover{background:#4a4a5e}

/* 详情页 */
#detailOverlay{width:800px;height:520px;left:112px;top:40px}
#detailOverlay h2{margin-bottom:2px}
#detailOverlay .meta{color:#aaa;margin-bottom:6px;font-size:13px}
#detailOverlay .img-area{float:left;width:260px;height:260px;background:#3a3a4e;border-radius:8px;margin-right:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#detailOverlay .img-area img{max-width:100%;max-height:100%}
#detailOverlay .info{overflow:hidden}
#detailOverlay .desc{background:#3a3a4e;padding:10px;border-radius:6px;margin:8px 0;font-size:13px;height:100px;overflow-y:auto}
.stars-row{display:flex;align-items:center;gap:6px;margin:8px 0}
.star-bar{width:200px;height:22px;background:#444;border-radius:11px;cursor:pointer;position:relative}
.star-fill{height:100%;background:#f1c40f;border-radius:11px}
#detailOverlay .comments{height:140px;overflow-y:auto;margin:8px 0}
#detailOverlay .comment{background:#3a3a4e;padding:4px 8px;margin:2px 0;border-radius:4px;font-size:12px}

/* 评论评分页 */
#ratingOverlay{width:750px;height:480px;left:137px;top:60px}
#ratingOverlay h3{margin-bottom:8px}
.slide-stars{display:flex;align-items:center;gap:8px;margin:10px 0}
.slide-bar{width:290px;height:50px;background:#444;border-radius:25px;cursor:pointer;position:relative}
.slide-fill{height:100%;background:#f1c40f;border-radius:25px;position:absolute;left:0;top:0;overflow:hidden}
.slide-fill-inner{width:290px;height:100%;background:linear-gradient(to right,#f1c40f,#f39c12)}
#ratingOverlay .comment-list{height:220px;overflow-y:auto;margin:8px 0;background:#333;border-radius:6px;padding:8px}
#ratingOverlay .comment{background:#3a3a4e;padding:6px 8px;margin:3px 0;border-radius:4px;font-size:13px}
.write-row{display:flex;gap:8px;align-items:center}
.write-row input[type=range]{width:200px}
.write-row input[type=text]{flex:1;padding:6px;border-radius:6px;border:none;background:#3a3a4e;color:#fff}
.write-row button{padding:6px 16px;background:#27ae60;color:#fff;border:none;border-radius:6px;cursor:pointer}

/* 路径信息条 */
#pathInfo{display:none;position:absolute;left:50%;top:0;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#f1c40f;padding:4px 16px;border-radius:0 0 8px 8px;font-size:13px;z-index:20;white-space:nowrap;max-width:900px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="container">
  <canvas id="mapCanvas" width="1024" height="600"></canvas>
  <div id="pathInfo"></div>

  <div id="searchOverlay" class="overlay"><button class="close">X</button><input type="text" placeholder="Search stores..." id="searchInput"><div id="searchResults"></div></div>
  <div id="sortOverlay" class="overlay"><button class="close">X</button><div class="catBtns"></div><div id="sortResults"></div></div>

  <!-- detail_screen -->
  <div id="detailOverlay" class="overlay">
    <button class="close">X</button>
    <h2 id="detailName"></h2>
    <div class="meta" id="detailMeta"></div>
    <div class="img-area"><img id="detailImg" src="" alt=""></div>
    <div class="info"><div class="desc" id="detailDesc"></div>
    <div class="stars-row"><span>Rating:</span><div class="star-bar" id="detailStarBar"><div class="star-fill" id="detailStarFill"></div></div><span id="detailStarRating">0.0</span></div></div>
    <div style="clear:both"></div>
    <div class="comments" id="detailComments"></div>
    <button style="position:absolute;right:100px;bottom:10px;background:#a24bc7;color:#fff;border:none;border-radius:6px;padding:6px 16px;cursor:pointer" id="detailCommentsBtn">detail comments</button>
  </div>

  <!-- rating_screen -->
  <div id="ratingOverlay" class="overlay">
    <button class="close">X</button>
    <h3 id="ratingTitle">Comments</h3>
    <div class="slide-stars">
      <span>Rate:</span>
      <div class="slide-bar" id="slideBar"><div class="slide-fill" id="slideFill" style="width:100%"><div class="slide-fill-inner"></div></div></div>
      <span id="slideRating">5.0</span>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="write-row">
      <input type="range" min="0.5" max="5" step="0.5" value="5" id="reviewScore">
      <span id="scoreLabel">5.0</span>
      <input type="text" placeholder="Write a comment..." id="reviewText" maxlength="60">
      <button id="submitReview">Submit</button>
    </div>
  </div>
</div>

<script>
// ===== 全局状态 =====
const W=1024,H=600;
let currentStores=[];
let currentFloor="F1";
let currentDetailStore="";
let clickPoint=null;
let pathLine=null;

// 页面返回栈（严格复刻 C 代码 back_screen_records + back_counts）
let backStack=[];
function backInit(){backStack=[]}
function backPush(page){if(backStack.length<19)backStack.push(page)}
function backPop(){
  if(backStack.length>0)return backStack.pop();
  return "F1";
}

const CATS=["Luxury","Watches","Beauty","Food","Electronics","Lifestyle"];

// F3 圆弧颜色
const ARC_COLORS=["#FF5722","#FF9800","#FFC107","#81D8D0","#00BCD4","#2196F3","#9C27B0","#E91E63"];
const ARC_LABELS=["beijing\nchufang","chulinglong","shanghechuan","yizuo\nyiwang","yanyu","wangpin\nniupai","zhenbao\nhaixian","chuxiang\nfurong"];

const canvas=document.getElementById("mapCanvas");
const ctx=canvas.getContext("2d");

// ===== API =====
async function fetchStores(){const r=await fetch("/api/stores");currentStores=await r.json();return currentStores}
async function storeDetail(name){const r=await fetch(`/api/store/${encodeURIComponent(name)}`);return await r.json()}
async function searchStores(q){const r=await fetch(`/api/search?q=${encodeURIComponent(q)}`);return await r.json()}
async function pathfind(floor,sx,sy,target){const r=await fetch(`/api/pathfind?floor=${floor}&sx=${sx}&sy=${sy}&target=${target}`);return await r.json()}
async function addComment(name,sc,cm){const r=await fetch("/api/comment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({store_name:name,score:sc,comment:cm})});return await r.json()}

// ===== 页面切换 =====
function gotoPage(page){
  document.getElementById("detailOverlay").style.display="none";
  document.getElementById("ratingOverlay").style.display="none";
  document.getElementById("searchOverlay").style.display="none";
  document.getElementById("sortOverlay").style.display="none";
  if(page==="detail"||page==="rating"){document.getElementById(page+"Overlay").style.display="block"}
  document.getElementById("pathInfo").style.display="none";
}

function navToDetail(storeName){
  backPush(currentFloor);
  currentDetailStore=storeName;
  gotoPage("detail");
  renderDetail();
  draw();
}
function navToRating(){
  backPush("detail");
  gotoPage("rating");
  renderRating();
}
function goBack(){
  let p=backPop();
  if(p==="detail"){gotoPage("detail");renderDetail();draw()}
  else{currentFloor=p;clickPoint=null;pathLine=null;gotoPage("page");document.getElementById("pathInfo").style.display="none";refreshAndDraw()}
}
function switchFloor(f){
  currentFloor=f;clickPoint=null;pathLine=null;
  backInit();
  gotoPage("page");
  document.getElementById("pathInfo").style.display="none";
  refreshAndDraw();
}

// ===== 绘制逻辑 =====
function hex(c){return c}
function drawCorridors(){
  ctx.strokeStyle="rgba(200,200,200,0.3)";ctx.lineWidth=20;ctx.lineCap="round";
  if(currentFloor==="F1"){
    ctx.beginPath();ctx.moveTo(135,160);ctx.lineTo(750,160);ctx.lineTo(750,425);ctx.lineTo(135,425);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(320,160);ctx.lineTo(320,425);ctx.stroke();
    ctx.beginPath();ctx.moveTo(320,305);ctx.lineTo(750,305);ctx.stroke();
  }
  if(currentFloor==="F2"){
    ctx.beginPath();ctx.moveTo(155,130);ctx.lineTo(155,440);ctx.lineTo(800,440);ctx.lineTo(800,130);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(600,130);ctx.lineTo(600,440);ctx.stroke();
    ctx.beginPath();ctx.moveTo(155,285);ctx.lineTo(600,285);ctx.stroke();
  }
  if(currentFloor==="F3"){
    ctx.beginPath();ctx.arc(512,300,250,0,Math.PI*2);ctx.lineWidth=80;ctx.stroke();
  }
}

function drawStoreButton(s){
  if(s.floor!==currentFloor)return;
  if(currentFloor==="F3"){
    if(s.name==="Sky Garden"){
      ctx.fillStyle=s.btn_color||"#7CFC00";
      ctx.beginPath();ctx.arc(512,300,110,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#000";ctx.font="16px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("sky garden",512,300);return;
    }
    const idx=s.btn_y-1;if(idx<0||idx>7)return;
    const angles=[[0,40],[45,85],[90,130],[135,175],[180,220],[225,265],[270,310],[315,355]];
    const[sa,ea]=angles[idx];const r=250,thick=80;
    ctx.strokeStyle=ARC_COLORS[idx];ctx.lineWidth=thick;
    ctx.beginPath();ctx.arc(512,300,r,(sa-90)*Math.PI/180,(ea-90)*Math.PI/180);ctx.stroke();
    const mid=(sa+ea)/2*Math.PI/180-Math.PI/2;
    const lr=r;let lx=512+lr*Math.cos(mid),ly=300+lr*Math.sin(mid);
    ctx.fillStyle="#fff";ctx.font="12px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
    const lines=ARC_LABELS[idx].split("\n");
    lines.forEach((l,i)=>ctx.fillText(l,lx,ly+(i-0.5)*14));
    return;
  }
  const bx=s.btn_x,by=s.btn_y,bw=s.btn_w,bh=s.btn_h;
  if(bw<=0||bh<=0)return;
  ctx.fillStyle=s.btn_color||"#a24bc7";
  ctx.globalAlpha=s.name===currentDetailStore?1:0.85;
  ctx.fillRect(bx,by,bw,bh);
  if(s.name===currentDetailStore){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh)}
  ctx.globalAlpha=1;
  ctx.fillStyle="#fff";ctx.font="13px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
  let label=s.name.length>18?s.name.substring(0,17)+"..":s.name;
  ctx.fillText(label,bx+bw/2,by+bh/2);
}

function drawNonStoreBtns(){
  ctx.font="12px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
  if(currentFloor==="F1"){
    const bts=[
      {x:37,y:200,w:80,h:80,c:"#000",t:"Lift 1"},{x:37,y:57,w:80,h:100,c:"#1A5276",t:"Serve 1"},
      {x:37,y:320,w:80,h:80,c:"#00CC00",t:"Escape"},{x:645,y:480,w:75,h:60,c:"#000",t:"Lift2"},
      {x:155,y:450,w:130,h:90,c:"#00CC00",t:"Entrance"},{x:315,y:480,w:75,h:60,c:"#1A5276",t:"Serve 2"},
    ];
    bts.forEach(b=>{ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle="#fff";ctx.fillText(b.t,b.x+b.w/2,b.y+b.h/2)});
    // 找路按钮
    [{x:950,y:65,t:"find\nserve"},{x:950,y:130,t:"find\nescape"},{x:950,y:195,t:"find\nlift"}].forEach(b=>{
      ctx.fillStyle="#FF0000";ctx.fillRect(b.x,b.y,50,50);ctx.fillStyle="#fff";ctx.fillText(b.t,b.x+25,b.y+25);
    });
  }
  if(currentFloor==="F2"){
    const bts=[
      {x:50,y:150,w:80,h:80,c:"#4682B4",t:"WC1"},{x:50,y:270,w:80,h:80,c:"#000",t:"Lift1"},
      {x:50,y:390,w:80,h:60,c:"#00CC00",t:"Escape1"},{x:820,y:150,w:80,h:80,c:"#00CC00",t:"Escape2"},
      {x:820,y:270,w:80,h:80,c:"#4682B4",t:"WC2"},{x:820,y:390,w:80,h:60,c:"#000",t:"Lift2"},
    ];
    bts.forEach(b=>{ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle="#fff";ctx.fillText(b.t,b.x+b.w/2,b.y+b.h/2)});
    [{x:950,y:65,t:"find\nWC"},{x:950,y:130,t:"find\nescape"},{x:950,y:195,t:"find\nlift"}].forEach(b=>{
      ctx.fillStyle="#FF0000";ctx.fillRect(b.x,b.y,50,50);ctx.fillStyle="#fff";ctx.fillText(b.t,b.x+25,b.y+25);
    });
  }
}

function drawFloorSwitch(){
  ctx.font="12px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
  // 右侧切换按钮
  ["F1","F2","F3"].forEach((f,i)=>{
    let y=270+i*65;
    ctx.fillStyle=currentFloor===f?"#00FF00":"#FF0000";
    ctx.fillRect(950,y,50,50);
    ctx.fillStyle="#fff";ctx.fillText(f,975,y+25);
  });
  // 返回 F0
  if(currentFloor!=="F0"){
    ctx.fillStyle="#FF0000";ctx.fillRect(10,550,50,50);
    ctx.fillStyle="#fff";ctx.fillText("F0",35,575);
  }
  // F0 显示切换按钮
  if(currentFloor==="F0"){
    ["F1","F2","F3"].forEach((f,i)=>{
      let y=270+i*65;
      ctx.fillStyle="#A24BC7";ctx.fillRect(950,y,50,50);
      ctx.fillStyle="#fff";ctx.fillText(f,975,y+25);
    });
  }
}

function drawUIBtns(){
  ctx.font="13px Segoe UI";ctx.textAlign="center";ctx.textBaseline="middle";
  // Search (950,475,50,50)
  ctx.fillStyle=currentFloor==="F0"?"#A24BC7":"#FF0000";
  ctx.fillRect(950,475,50,50);ctx.fillStyle="#fff";ctx.fillText("search",975,500);
  // Sort (950,550,50,50)
  ctx.fillStyle=currentFloor==="F0"?"#A24BC7":"#FF0000";
  ctx.fillRect(950,550,50,50);ctx.fillStyle="#fff";ctx.fillText("sort",975,575);
}

function drawClickPoint(){
  if(!clickPoint||currentFloor==="F0"||currentFloor==="F3")return;
  ctx.fillStyle="#FF0000";
  ctx.beginPath();ctx.arc(clickPoint.x,clickPoint.y,10,0,Math.PI*2);ctx.fill();
}

function drawPathLine(){
  if(!pathLine||pathLine.length<2)return;
  ctx.strokeStyle="#FF0000";ctx.lineWidth=8;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(pathLine[0].x,pathLine[0].y);
  for(let i=1;i<pathLine.length;i++)ctx.lineTo(pathLine[i].x,pathLine[i].y);
  ctx.stroke();
}

function drawCrosshair(){
  if(!clickPoint||currentFloor==="F0"||currentFloor==="F3")return;
  ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(clickPoint.x,0);ctx.lineTo(clickPoint.x,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,clickPoint.y);ctx.lineTo(W,clickPoint.y);ctx.stroke();
  ctx.setLineDash([]);
}

function drawCoord(){
  if(!clickPoint||currentFloor==="F0"||currentFloor==="F3")return;
  ctx.fillStyle="#FF0";ctx.font="12px Segoe UI";ctx.textAlign="left";
  ctx.fillText(`X: ${clickPoint.x}  Y: ${clickPoint.y}`,800,20);
}

function drawF0(){
  ctx.fillStyle="rgba(255,255,255,0.03)";ctx.textAlign="center";
  ctx.font="40px Segoe UI";ctx.fillStyle="#fff";ctx.fillText("SKP MALL",512,70);
  ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(200,95);ctx.lineTo(824,95);ctx.stroke();

  const floors=[{id:"F1",t:"Floor 1",s:"Luxury · Watches · Beauty · Lifestyle · Food",x:80},{id:"F2",t:"Floor 2",s:"Luxury · Fashion · Electronics · Lifestyle · Food",x:372},{id:"F3",t:"Floor 3",s:"Food & Dining · Sky Garden",x:664}];
  floors.forEach(f=>{
    ctx.fillStyle="rgba(255,255,255,0.05)";ctx.fillRect(f.x,115,280,310);
    ctx.fillStyle="#fff";ctx.font="bold 20px Segoe UI";ctx.fillText(f.t,f.x+140,145);
    ctx.fillStyle="#aaa";ctx.font="11px Segoe UI";ctx.fillText(f.s,f.x+140,168);
    let fs=currentStores.filter(s=>s.floor===f.id);
    ctx.textAlign="left";ctx.font="11px Segoe UI";let sy=195;
    fs.forEach(s=>{if(sy>f.x+310)return;
      ctx.fillStyle=s.btn_color||"#999";ctx.fillRect(f.x+10,sy-3,8,8);
      ctx.fillStyle="#ccc";let n=s.name.length>22?s.name.substring(0,21)+"..":s.name;
      ctx.fillText(n,f.x+24,sy+3);sy+=16});
    ctx.textAlign="center";
  });

  ctx.textAlign="left";
  ctx.fillStyle="rgba(255,255,255,0.03)";ctx.fillRect(80,440,400,115);
  ctx.fillStyle="#ccc";ctx.font="14px Segoe UI";ctx.fillText("Categories:",95,462);
  let y=485;
  const catCol={"Luxury":"#FF8C00","Watches":"#0074E4","Beauty":"#FF69B4","Food":"#FF5722","Electronics":"#00BCD4","Lifestyle":"#2ECC71"};
  Object.entries(catCol).forEach(([c,col])=>{
    ctx.fillStyle=col;ctx.fillRect(95,y-5,10,10);
    ctx.fillStyle="#ccc";ctx.font="12px Segoe UI";ctx.fillText(c,115,y+2);y+=20;
  });
  ctx.fillStyle="rgba(255,255,255,0.05)";ctx.fillRect(500,460,440,95);
  ctx.font="12px Segoe UI";ctx.fillStyle="#aaa";
  ctx.fillText("Click a floor card to enter","530,485");
  ctx.fillText("Search stores by name | Sort by category","530,505");
  ctx.fillText("Click stores to see details, ratings & reviews","530,525");
  ctx.textAlign="center";
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,W,H);
  if(currentFloor==="F0"){drawF0();drawUIBtns();return}
  drawCorridors();
  let fs=currentStores.filter(s=>s.floor===currentFloor);
  fs.forEach(s=>drawStoreButton(s));
  drawNonStoreBtns();drawFloorSwitch();drawUIBtns();
  drawPathLine();drawCrosshair();drawClickPoint();drawCoord();
}

async function refreshAndDraw(){await fetchStores();draw()}

// ===== 渲染详情 & 评论 =====
async function renderDetail(){
  let d=currentStores.find(s=>s.name===currentDetailStore);
  if(!d||!d.rating){d=await storeDetail(currentDetailStore)}
  document.getElementById("detailName").textContent=d.name;
  document.getElementById("detailMeta").textContent=`${d.floor} | ${d.category} | Location: ${d.x}, ${d.y}`;
  document.getElementById("detailDesc").textContent=d.desc;
  document.getElementById("detailStarRating").textContent=d.rating||0;
  document.getElementById("detailStarFill").style.width=((d.rating||0)/5*100)+"%";
  // 图片
  let imgPath=d.img_path||"";
  let pngName=imgPath.replace(".bin",".png");
  document.getElementById("detailImg").src=`/static/img/${pngName}`;

  let cmt=d.comments||[];
  let dc=document.getElementById("detailComments");
  dc.innerHTML=cmt.length===0?"<i style='color:#aaa'>No comments yet.</i>":cmt.map(c=>`<div class="comment">${c.name} [${c.score}] ${c.comment}</div>`).join("");
}

async function renderRating(){
  let d=await storeDetail(currentDetailStore);
  document.getElementById("ratingTitle").textContent=d.name+" - Comments";
  let cmt=d.comments||[];
  document.getElementById("commentList").innerHTML=cmt.length===0?"<i style='color:#aaa'>No comments yet.</i>":cmt.map(c=>`<div class="comment">${c.name} [${c.score}] ${c.comment}</div>`).join("");
  document.getElementById("slideFill").style.width="100%";
  document.getElementById("slideRating").textContent="5.0";
  document.getElementById("reviewScore").value=5;document.getElementById("scoreLabel").textContent="5.0";
  document.getElementById("reviewText").value="";
}

// ===== 事件处理 =====
// 滑动星星评分
let slideActive=false;
document.getElementById("slideBar").addEventListener("mousedown",e=>{slideActive=true;updateSlide(e)});
document.getElementById("slideBar").addEventListener("mousemove",e=>{if(slideActive)updateSlide(e)});
document.addEventListener("mouseup",()=>{slideActive=false});
function updateSlide(e){
  let bar=document.getElementById("slideBar");
  let rect=bar.getBoundingClientRect();
  let x=e.clientX-rect.left;
  if(x<0)x=0;if(x>290)x=290;
  let thresholds=[25,60,85,120,145,180,205,240,265,290];
  let scores=[0.5,1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.5,5.0];
  let w=0,sc=0;
  for(let i=0;i<thresholds.length;i++){if(x<=thresholds[i]){w=thresholds[i];sc=scores[i];break}}
  document.getElementById("slideFill").style.width=(w/290*100)+"%";
  document.getElementById("slideRating").textContent=sc.toFixed(1);
  document.getElementById("reviewScore").value=sc;document.getElementById("scoreLabel").textContent=sc.toFixed(1);
}

document.getElementById("reviewScore").addEventListener("input",function(){
  document.getElementById("scoreLabel").textContent=parseFloat(this.value).toFixed(1);
});

document.getElementById("submitReview").addEventListener("click",async()=>{
  let sc=parseFloat(document.getElementById("reviewScore").value);
  let txt=document.getElementById("reviewText").value.trim();
  if(!currentDetailStore||!txt)return;
  let r=await addComment(currentDetailStore,sc,txt);
  // 刷新
  await fetchStores();renderRating();renderDetail();
});

// 详情页按钮
document.querySelector("#detailOverlay .close").addEventListener("click",()=>{
  goBack();
});
document.querySelector("#ratingOverlay .close").addEventListener("click",()=>{
  goBack();
});
document.getElementById("detailStarBar").addEventListener("click",()=>{
  navToRating();
});
document.getElementById("detailCommentsBtn").addEventListener("click",()=>{
  navToRating();
});

// 搜索
document.getElementById("searchInput").addEventListener("input",async function(){
  let r=await searchStores(this.value);
  document.getElementById("searchResults").innerHTML=r.map(s=>`<div class="item" data-name="${s.name}">${s.name} (${s.floor}|${s.category}|${s.rating})</div>`).join("");
});
document.getElementById("searchResults").addEventListener("click",e=>{
  let it=e.target.closest(".item");if(!it)return;
  let n=it.dataset.name;
  document.getElementById("searchOverlay").style.display="none";
  let s=currentStores.find(x=>x.name===n);
  if(s)switchFloor(s.floor);
  setTimeout(()=>navToDetail(n),300);
});
document.querySelector("#searchOverlay .close").addEventListener("click",()=>document.getElementById("searchOverlay").style.display="none");

// 排序
function openSort(){
  document.getElementById("sortOverlay").style.display="block";
  document.querySelector("#sortOverlay .catBtns").innerHTML=CATS.map(c=>`<button data-cat="${c}">${c}</button>`).join("");
  showCatStores(CATS[0]);
}
document.querySelector("#sortOverlay .catBtns").addEventListener("click",e=>{if(e.target.tagName==="BUTTON")showCatStores(e.target.dataset.cat)});
document.querySelector("#sortOverlay .close").addEventListener("click",()=>document.getElementById("sortOverlay").style.display="none");
function showCatStores(cat){
  let stores=currentStores.filter(s=>s.category===cat);
  document.getElementById("sortResults").innerHTML=stores.map(s=>`<div class="item" data-name="${s.name}">${s.name} (${s.floor}|rating:${s.rating})</div>`).join("");
}
document.getElementById("sortResults").addEventListener("click",e=>{
  let it=e.target.closest(".item");if(!it)return;
  let n=it.dataset.name;
  document.getElementById("sortOverlay").style.display="none";
  let s=currentStores.find(x=>x.name===n);
  if(s)switchFloor(s.floor);
  setTimeout(()=>navToDetail(n),300);
});

// ===== Canvas 点击 =====
canvas.addEventListener("click",async e=>{
  let rect=canvas.getBoundingClientRect();
  let cx=e.clientX-rect.left,cy=e.clientY-rect.top;

  // F0 楼层卡片点击
  if(currentFloor==="F0"){
    if(cy>=115&&cy<=425){
      if(cx>=80&&cx<=360)switchFloor("F1");
      else if(cx>=372&&cx<=652)switchFloor("F2");
      else if(cx>=664&&cx<=944)switchFloor("F3");
    }
    // UI 按钮
    if(cx>=950&&cx<=1000){
      if(cy>=475&&cy<=525){document.getElementById("searchOverlay").style.display="block";document.getElementById("searchInput").value="";document.getElementById("searchResults").innerHTML="";document.getElementById("searchInput").focus()}
      if(cy>=550&&cy<=600)openSort();
    }
    if(cx>=950&&cx<=1000){
      if(cy>=270&&cy<=320)switchFloor("F1");if(cy>=335&&cy<=385)switchFloor("F2");if(cy>=400&&cy<=450)switchFloor("F3");
    }
    draw();return;
  }

  // UI 按钮
  if(cx>=950&&cx<=1000){
    if(cy>=475&&cy<=525){document.getElementById("searchOverlay").style.display="block";document.getElementById("searchInput").value="";document.getElementById("searchResults").innerHTML="";document.getElementById("searchInput").focus();document.getElementById("sortOverlay").style.display="none";return}
    if(cy>=550&&cy<=600){openSort();document.getElementById("searchOverlay").style.display="none";return}
    if(cy>=270&&cy<=320)switchFloor("F1");if(cy>=335&&cy<=385)switchFloor("F2");if(cy>=400&&cy<=450)switchFloor("F3");
    return;
  }
  if(cx>=10&&cx<=60&&cy>=550&&cy<=600){switchFloor("F0");return}

  // 商铺点击
  let fs=currentStores.filter(s=>s.floor===currentFloor);
  for(let s of fs){
    if(currentFloor==="F3"){
      if(s.name==="Sky Garden"){let d=Math.sqrt((cx-512)**2+(cy-300)**2);if(d<=110){navToDetail(s.name);return}continue}
      let idx=s.btn_y-1;if(idx<0||idx>7)continue;
      let angles=[[0,40],[45,85],[90,130],[135,175],[180,220],[225,265],[270,310],[315,355]];
      let[sa,ea]=angles[idx],r=250;
      let d=Math.sqrt((cx-512)**2+(cy-300)**2);
      if(d>=210&&d<=290){
        let ang=Math.atan2(cy-300,cx-512)*180/Math.PI+90;if(ang<0)ang+=360;
        if(ang>=sa&&ang<=ea){navToDetail(s.name);return}
      }
      continue;
    }
    let bx=s.btn_x,by=s.btn_y,bw=s.btn_w,bh=s.btn_h;
    if(bw<=0||bh<=0)continue;
    if(cx>=bx&&cx<=bx+bw&&cy>=by&&cy<=by+bh){navToDetail(s.name);return}
  }

  // 找路按钮
  if((currentFloor==="F1"||currentFloor==="F2")&&cx>=950&&cx<=1000){
    let tgt=null;
    if(cy>=65&&cy<=115)tgt=currentFloor==="F1"?"serve":"wc";
    else if(cy>=130&&cy<=180)tgt="escape";
    else if(cy>=195&&cy<=245)tgt="lift";
    if(tgt&&clickPoint){
      let r=await pathfind(currentFloor,clickPoint.x,clickPoint.y,tgt);
      if(r.path){pathLine=r.path;
        document.getElementById("pathInfo").style.display="block";
        document.getElementById("pathInfo").textContent=(r.message?r.message+" | ":"")+r.directions;
        draw()}
    }
    return;
  }

  // 走廊点击
  if(currentFloor==="F1"||currentFloor==="F2"){
    let r=await fetch(`/api/check_path?floor=${currentFloor}&x=${Math.round(cx)}&y=${Math.round(cy)}`);
    let d=await r.json();
    if(d.on_path){clickPoint={x:Math.round(cx),y:Math.round(cy)};draw()}
  }
});

// ===== 初始化 =====
fetchStores().then(()=>{switchFloor("F0")});
</script>
