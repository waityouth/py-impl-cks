<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SKP Mall Navigation</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; }

#container {
  position:relative; width:1024px; height:600px;
  background:#1a1a2e; overflow:hidden;
}
canvas { display:block; width:1024px; height:600px; }

/* 覆盖层（绝对定位在 container 内） */
.overlay {
  display:none; position:absolute; background:#2a2a3e;
  border:2px solid #555; border-radius:12px; z-index:100;
  color:#eee; font-size:14px; padding:14px;
}
.overlay .close { position:absolute; top:8px; right:8px; background:#e74c3c; color:#fff;
  border:none; border-radius:6px; padding:4px 12px; cursor:pointer; font-size:13px; }

/* 搜索弹窗 */
#searchOverlay { width:750px; height:420px; left:137px; top:90px; }
#searchOverlay input { width:100%; padding:10px; font-size:16px; border:none; border-radius:6px;
  background:#3a3a4e; color:#fff; }
#searchResults { margin-top:10px; max-height:320px; overflow-y:auto; }
#searchResults .item { padding:10px 14px; background:#3a3a4e; margin:4px 0; border-radius:6px;
  cursor:pointer; color:#ddd; }
#searchResults .item:hover { background:#4a4a5e; }

/* 排序弹窗 */
#sortOverlay { width:700px; height:420px; left:162px; top:90px; }
.catBtns { display:flex; flex-wrap:wrap; gap:6px; }
.catBtns button { padding:8px 16px; border:none; border-radius:6px; background:#a24bc7;
  color:#fff; cursor:pointer; font-size:14px; }
.catBtns button:hover { background:#822ba7; }
#sortResults { margin-top:10px; max-height:300px; overflow-y:auto; }
#sortResults .item { padding:10px 14px; background:#3a3a4e; margin:4px 0; border-radius:6px;
  cursor:pointer; color:#ddd; }
#sortResults .item:hover { background:#4a4a5e; }

/* 详情弹窗 */
#detailOverlay { width:800px; height:520px; left:112px; top:40px; }
#detailOverlay h2 { margin-bottom:4px; }
#detailOverlay .meta { color:#aaa; margin-bottom:8px; }
#detailOverlay .desc { background:#3a3a4e; padding:12px; border-radius:6px; margin:10px 0;
  max-height:120px; overflow-y:auto; }
#detailOverlay .stars { display:flex; align-items:center; gap:6px; margin:8px 0; }
.star-bar { width:200px; height:24px; background:#444; border-radius:12px; position:relative; cursor:pointer; }
.star-fill { height:100%; background:#f1c40f; border-radius:12px; transition:width 0.2s; }
#detailOverlay .comments { max-height:180px; overflow-y:auto; margin:10px 0; }
#detailOverlay .comment { background:#3a3a4e; padding:6px 10px; margin:3px 0; border-radius:6px; font-size:13px; }
.writeReview { display:flex; gap:8px; align-items:center; margin-top:8px; }
.writeReview input[type=range] { width:120px; }
.writeReview input[type=text] { flex:1; padding:6px; border-radius:6px; border:none; background:#3a3a4e; color:#fff; }
.writeReview button { padding:6px 14px; background:#27ae60; color:#fff; border:none; border-radius:6px; cursor:pointer; }

/* 路径指引条 */
#pathInfo { display:none; position:absolute; left:50%; top:0; transform:translateX(-50%);
  background:rgba(0,0,0,0.85); color:#f1c40f; padding:4px 16px; border-radius:0 0 8px 8px;
  font-size:13px; z-index:20; white-space:nowrap; max-width:900px; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="container">
  <canvas id="mapCanvas" width="1024" height="600"></canvas>

  <div id="pathInfo"></div>

  <!-- 搜索弹窗 -->
  <div id="searchOverlay" class="overlay">
    <button class="close">X</button>
    <input type="text" placeholder="Search stores..." id="searchInput">
    <div id="searchResults"></div>
  </div>

  <!-- 排序弹窗 -->
  <div id="sortOverlay" class="overlay">
    <button class="close">X</button>
    <div class="catBtns"></div>
    <div id="sortResults"></div>
  </div>

  <!-- 详情弹窗 -->
  <div id="detailOverlay" class="overlay">
    <button class="close">X</button>
    <h2 id="detailName"></h2>
    <div class="meta" id="detailMeta"></div>
    <div class="desc" id="detailDesc"></div>
    <div class="stars">
      <span>Rating:</span>
      <div class="star-bar"><div class="star-fill" id="starFill"></div></div>
      <span id="starRating">0.0</span>
    </div>
    <div class="comments" id="detailComments"></div>
    <div class="writeReview">
      <input type="range" min="0.5" max="5.0" step="0.5" value="5.0" id="reviewScore">
      <span id="reviewScoreLabel">5.0</span>
      <input type="text" placeholder="Write a comment..." id="reviewText" maxlength="60">
      <button id="submitReview">Submit</button>
    </div>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
const W = 1024, H = 600;
let currentFloor = "F0";
let currentDetailStore = "";
let clickPoint = null;
let pathLine = null;
let currentStores = [];

const CAT_COLORS = {
    Luxury: "#ff8c00", Watches: "#0074e4", Beauty: "#ff69b4",
    Food: "#ff5722", Electronics: "#00bcd4", Lifestyle: "#2ecc71"
};
const CATEGORIES = ["Luxury", "Watches", "Beauty", "Food", "Electronics", "Lifestyle"];

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

// ==================== API ====================
async function fetchStores() {
    const resp = await fetch("/api/stores");
    currentStores = await resp.json();
    return currentStores;
}
async function fetchStoreDetail(name) {
    const resp = await fetch(`/api/store/${encodeURIComponent(name)}`);
    return await resp.json();
}
async function searchStores(q) {
    const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    return await resp.json();
}
async function findPath(floor, sx, sy, target) {
    const url = `/api/pathfind?floor=${floor}&sx=${sx}&sy=${sy}&target=${target}`;
    const resp = await fetch(url);
    return await resp.json();
}
async function addComment(storeName, score, comment) {
    const resp = await fetch("/api/comment", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({store_name:storeName, score:score, comment:comment})
    });
    return await resp.json();
}

// ==================== 绘制函数（精确坐标，无缩放） ====================

function drawCorridors() {
    ctx.strokeStyle = "rgba(200,200,200,0.3)";
    ctx.lineWidth = 20;
    ctx.lineCap = "round";
    if (currentFloor === "F1") {
        // 外框矩形
        ctx.beginPath();
        ctx.moveTo(135,160); ctx.lineTo(750,160); ctx.lineTo(750,425); ctx.lineTo(135,425); ctx.closePath();
        ctx.stroke();
        // 中间竖线
        ctx.beginPath(); ctx.moveTo(320,160); ctx.lineTo(320,425); ctx.stroke();
        // 中间横线（右半）
        ctx.beginPath(); ctx.moveTo(320,305); ctx.lineTo(750,305); ctx.stroke();
    }
    if (currentFloor === "F2") {
        ctx.beginPath();
        ctx.moveTo(155,130); ctx.lineTo(155,440); ctx.lineTo(800,440); ctx.lineTo(800,130); ctx.closePath();
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(600,130); ctx.lineTo(600,440); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(155,285); ctx.lineTo(600,285); ctx.stroke();
    }
    if (currentFloor === "F3") {
        ctx.beginPath();
        ctx.arc(512, 300, 250, 0, Math.PI*2);
        ctx.lineWidth = 80;
        ctx.stroke();
    }
}

function drawStoreButton(store) {
    const floor = store.floor;

    // F3 圆弧按钮
    if (floor === "F3") {
        if (store.name === "Sky Garden") {
            ctx.fillStyle = "#7cfc00";
            ctx.beginPath();
            ctx.arc(512, 300, 110, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.font = "16px Segoe UI";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("sky garden", 512, 300);
            return;
        }
        const idx = store.btn_y; // F3: btn_y 存的是编号 1-8
        const arcAngles = [
            [0,40],[45,85],[90,130],[135,175],[180,220],[225,265],[270,310],[315,355]
        ];
        const colors = ["#ff5722","#ff9800","#ffc107","#81d8d0","#00bcd4","#2196f3","#9c27b0","#e91e63"];
        const [sa, ea] = arcAngles[idx-1];
        const mid = (sa+ea)/2 * Math.PI/180;
        const centerX = 512, centerY = 300, r = 250, thick = 80;

        // 画圆弧段
        ctx.strokeStyle = colors[idx-1];
        ctx.lineWidth = thick;
        ctx.beginPath();
        const startRad = sa * Math.PI/180 - Math.PI/2;
        const endRad = ea * Math.PI/180 - Math.PI/2;
        ctx.arc(centerX, centerY, r, startRad, endRad);
        ctx.stroke();

        // 标签
        const labelR = r;
        const lx = centerX + labelR * Math.cos(mid - Math.PI/2);
        const ly = centerY + labelR * Math.sin(mid - Math.PI/2);
        ctx.fillStyle = "#fff";
        ctx.font = "12px Segoe UI";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(store.name.substring(0,10), lx, ly);
        return;
    }

    // F1/F2 矩形按钮（btn_x, btn_y, btn_w, btn_h 严格来自 C 文件）
    const bx = store.btn_x, by = store.btn_y, bw = store.btn_w, bh = store.btn_h;
    if (bw <= 0 || bh <= 0) return;

    const color = CAT_COLORS[store.category] || "#a24bc7";
    const isSelected = (store.name === currentDetailStore);

    ctx.fillStyle = color;
    ctx.globalAlpha = isSelected ? 1 : 0.85;
    ctx.fillRect(bx, by, bw, bh);
    if (isSelected) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);
    }
    ctx.globalAlpha = 1;

    // 文字标签（居中）
    ctx.fillStyle = "#fff";
    ctx.font = "13px Segoe UI";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const label = store.name.length > 18 ? store.name.substring(0,17)+".." : store.name;
    const lines = label.split("\n");
    if (lines.length === 1) {
        ctx.fillText(label, bx + bw/2, by + bh/2);
    } else {
        lines.forEach((l,i) => {
            ctx.fillText(l, bx + bw/2, by + bh/2 + (i-0.5)*14);
        });
    }
}

function drawNonStoreButtons() {
    ctx.font = "12px Segoe UI";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // F1 层公共设施按钮
    if (currentFloor === "F1") {
        const btns = [
            {x:37,y:200,w:80,h:80,c:"#000",t:"Lift 1"},
            {x:37,y:57,w:80,h:100,c:"#1A5276",t:"Serve 1"},
            {x:37,y:320,w:80,h:80,c:"#0C0",t:"Escape"},
            {x:645,y:480,w:75,h:60,c:"#000",t:"Lift2"},
            {x:155,y:450,w:130,h:90,c:"#0C0",t:"Entrance"},
            {x:315,y:480,w:75,h:60,c:"#1A5276",t:"Serve 2"},
            // 找路按钮（右侧）
            {x:950,y:65,w:50,h:50,c:"#e74c3c",t:"find\nserve", target:"serve"},
            {x:950,y:130,w:50,h:50,c:"#e74c3c",t:"find\nescape", target:"escape"},
            {x:950,y:195,w:50,h:50,c:"#e74c3c",t:"find\nlift", target:"lift"},
        ];
        btns.forEach(b => {
            ctx.fillStyle = b.c;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = "#fff";
            ctx.fillText(b.t, b.x+b.w/2, b.y+b.h/2);
        });
    }

    // F2 层公共设施按钮
    if (currentFloor === "F2") {
        const btns = [
            {x:50,y:150,w:80,h:80,c:"#4682B4",t:"WC1"},
            {x:50,y:270,w:80,h:80,c:"#000",t:"Lift1"},
            {x:50,y:390,w:80,h:60,c:"#0C0",t:"Escape1"},
            {x:820,y:150,w:80,h:80,c:"#0C0",t:"Escape2"},
            {x:820,y:270,w:80,h:80,c:"#4682B4",t:"WC2"},
            {x:820,y:390,w:80,h:60,c:"#000",t:"Lift2"},
            // 找路按钮
            {x:950,y:65,w:50,h:50,c:"#e74c3c",t:"find\nWC", target:"wc"},
            {x:950,y:130,w:50,h:50,c:"#e74c3c",t:"find\nescape", target:"escape"},
            {x:950,y:195,w:50,h:50,c:"#e74c3c",t:"find\nlift", target:"lift"},
        ];
        btns.forEach(b => {
            ctx.fillStyle = b.c;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = "#fff";
            ctx.fillText(b.t, b.x+b.w/2, b.y+b.h/2);
        });
    }

    // 楼层切换按钮（所有楼层通用，右侧）
    const fs = [
        {t:"F1",y:270}, {t:"F2",y:335}, {t:"F3",y:400}
    ];
    fs.forEach(f => {
        const active = currentFloor === "F"+(f.t==="F1"?1:f.t==="F2"?2:3);
        ctx.fillStyle = active ? "#0C0" : "#e74c3c";
        ctx.fillRect(950, f.y, 50, 50);
        ctx.fillStyle = "#fff";
        ctx.fillText(f.t, 975, f.y+25);
    });

    // 返回 F0 按钮（非 F0 层底部左侧）
    if (currentFloor !== "F0") {
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(10, 550, 50, 50);
        ctx.fillStyle = "#fff";
        ctx.fillText("F0", 35, 575);
    }

    // F0 层切换按钮
    if (currentFloor === "F0") {
        fs.forEach(f => {
            ctx.fillStyle = "#A24BC7";
            ctx.fillRect(950, f.y, 50, 50);
            ctx.fillStyle = "#fff";
            ctx.fillText(f.t, 975, f.y+25);
        });
    }
}

function drawUIButtons() {
    ctx.font = "13px Segoe UI";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 搜索按钮 (950, 475, 50, 50)
    ctx.fillStyle = currentFloor==="F0" ? "#A24BC7" : "#e74c3c";
    ctx.fillRect(950, 475, 50, 50);
    ctx.fillStyle = "#fff";
    ctx.fillText("search", 975, 500);

    // 排序按钮 (950, 550, 50, 50)
    ctx.fillStyle = currentFloor==="F0" ? "#A24BC7" : "#e74c3c";
    ctx.fillRect(950, 550, 50, 50);
    ctx.fillStyle = "#fff";
    ctx.fillText("sort", 975, 575);
}

function drawClickPoint() {
    if (!clickPoint) return;
    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.arc(clickPoint.x, clickPoint.y, 10, 0, Math.PI*2);
    ctx.fill();
}

function drawPathLine() {
    if (!pathLine || pathLine.length < 2) return;
    ctx.strokeStyle = "#ff0000";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(pathLine[0].x, pathLine[0].y);
    for (let i = 1; i < pathLine.length; i++) {
        ctx.lineTo(pathLine[i].x, pathLine[i].y);
    }
    ctx.stroke();
}

function drawCrosshair() {
    if (!clickPoint) return;
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(clickPoint.x, 0); ctx.lineTo(clickPoint.x, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, clickPoint.y); ctx.lineTo(W, clickPoint.y); ctx.stroke();
    ctx.setLineDash([]);
}

function drawF0Overview() {
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    ctx.textAlign = "center";

    // 标题
    ctx.font = "40px Segoe UI";
    ctx.fillStyle = "#fff";
    ctx.fillText("SKP MALL", 512, 80);

    // 分隔线
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(200, 110); ctx.lineTo(824, 110); ctx.stroke();

    // 楼层卡片
    const floors = [
        {id:"F1", title:"Floor 1", sub:"Luxury · Watches · Beauty · Lifestyle · Food", x:80, y:140, w:280, h:310},
        {id:"F2", title:"Floor 2", sub:"Luxury · Fashion · Electronics · Lifestyle · Food", x:372, y:140, w:280, h:310},
        {id:"F3", title:"Floor 3", sub:"Food & Dining · Sky Garden", x:664, y:140, w:280, h:310},
    ];

    floors.forEach(f => {
        // 卡片背景
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        const isHovered = (currentFloor === f.id);
        if (isHovered) ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.fillRect(f.x, f.y, f.w, f.h);

        // 卡片标题
        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px Segoe UI";
        ctx.fillText(f.title, f.x + f.w/2, f.y + 30);

        // 副标题
        ctx.fillStyle = "#aaa";
        ctx.font = "12px Segoe UI";
        ctx.fillText(f.sub, f.x + f.w/2, f.y + 55);

        // 卡片内商铺列表
        const floorStores = currentStores.filter(s => s.floor === f.id);
        ctx.textAlign = "left";
        ctx.font = "11px Segoe UI";
        let sy = f.y + 80;
        floorStores.forEach(s => {
            if (sy > f.y + f.h - 20) return;
            ctx.fillStyle = CAT_COLORS[s.category] || "#999";
            ctx.fillRect(f.x + 10, sy - 3, 8, 8);
            ctx.fillStyle = "#ccc";
            let name = s.name.length > 20 ? s.name.substring(0,19)+".." : s.name;
            ctx.fillText(name, f.x + 24, sy + 3);
            sy += 18;
        });
        ctx.textAlign = "center";
    });

    // 图例
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    ctx.fillRect(80, 470, 400, 115);
    ctx.fillStyle = "#ccc";
    ctx.font = "14px Segoe UI";
    ctx.fillText("Categories:", 95, 492);
    let y = 515;
    Object.entries(CAT_COLORS).forEach(([cat, color]) => {
        ctx.fillStyle = color;
        ctx.fillRect(95, y-5, 10, 10);
        ctx.fillStyle = "#ccc";
        ctx.fillText(cat, 115, y + 2);
        y += 20;
    });

    // 操作提示
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.fillRect(500, 500, 440, 85);
    ctx.textAlign = "left";
    ctx.font = "13px Segoe UI";
    ctx.fillStyle = "#aaa";
    ctx.fillText("How to use:", 515, 522);
    ctx.font = "12px Segoe UI";
    ctx.fillText("Click a floor card to enter  |  Search for stores by name", 515, 542);
    ctx.fillText("Sort stores by category  |  Click a store to see details & reviews", 515, 560);
    ctx.textAlign = "center";
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, W, H);

    if (currentFloor === "F0") {
        drawF0Overview();
        drawUIButtons();
        return;
    }

    drawCorridors();

    const floorStores = currentStores.filter(s => s.floor === currentFloor);
    floorStores.forEach(s => drawStoreButton(s));

    drawNonStoreButtons();
    drawUIButtons();
    drawPathLine();
    drawCrosshair();
    drawClickPoint();
}

async function refreshAndDraw() {
    await fetchStores();
    draw();
}

// ==================== 点击检测 ====================

canvas.addEventListener("click", async (e) => {
    if (currentFloor === "F0") {
        // 检测 F0 楼层卡片点击
        if (cy >= 140 && cy <= 450) {
            if (cx >= 80 && cx <= 360) { currentFloor="F1"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); }
            else if (cx >= 372 && cx <= 652) { currentFloor="F2"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); }
            else if (cx >= 664 && cx <= 944) { currentFloor="F3"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); }
        }
        draw(); return;
    }
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;

    // 检测是否点击了右侧 UI 按钮
    // 搜索按钮
    if (cx >= 950 && cx <= 1000 && cy >= 475 && cy <= 525) {
        document.getElementById("searchOverlay").style.display = "block";
        document.getElementById("searchInput").value = "";
        document.getElementById("searchResults").innerHTML = "";
        document.getElementById("searchInput").focus();
        return;
    }
    // 排序按钮
    if (cx >= 950 && cx <= 1000 && cy >= 550 && cy <= 600) {
        openSortOverlay();
        return;
    }
    // 楼层切换按钮
    if (cx >= 950 && cx <= 1000) {
        if (cy >= 270 && cy <= 320) { currentFloor="F1"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); return; }
        if (cy >= 335 && cy <= 385) { currentFloor="F2"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); return; }
        if (cy >= 400 && cy <= 450) { currentFloor="F3"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); return; }
    }
    // F0 返回按钮
    if (cx >= 10 && cx <= 60 && cy >= 550 && cy <= 600) {
        currentFloor="F0"; clickPoint=null; pathLine=null; document.getElementById("pathInfo").style.display="none"; refreshAndDraw(); return;
    }

    // 检测商铺按钮点击
    const floorStores = currentStores.filter(s => s.floor === currentFloor);
    for (const store of floorStores) {
        if (store.floor === "F3") {
            if (store.name === "Sky Garden") {
                const dist = Math.sqrt((cx-512)**2 + (cy-300)**2);
                if (dist <= 110) { showDetail(store.name); return; }
                continue;
            }
            // F3 圆弧段点击检测
            const idx = store.btn_y;
            const [sa, ea] = [[0,40],[45,85],[90,130],[135,175],[180,220],[225,265],[270,310],[315,355]][idx-1];
            const dist = Math.sqrt((cx-512)**2 + (cy-300)**2);
            if (dist >= 210 && dist <= 290) {
                let ang = Math.atan2(cy-300, cx-512) * 180/Math.PI + 90;
                if (ang < 0) ang += 360;
                if (ang >= sa && ang <= ea) { showDetail(store.name); return; }
            }
            continue;
        }
        // F1/F2 矩形按钮
        const bx = store.btn_x, by = store.btn_y, bw = store.btn_w, bh = store.btn_h;
        if (bw <= 0 || bh <= 0) continue;
        if (cx >= bx && cx <= bx+bw && cy >= by && cy <= by+bh) {
            showDetail(store.name);
            return;
        }
    }

    // 检测找路按钮
    if (currentFloor === "F1" || currentFloor === "F2") {
        if (cx >= 950 && cx <= 1000) {
            let target = null;
            if (cy >= 65 && cy <= 115) target = (currentFloor==="F1") ? "serve" : "wc";
            else if (cy >= 130 && cy <= 180) target = "escape";
            else if (cy >= 195 && cy <= 245) target = "lift";
            if (target && clickPoint) {
                const result = await findPath(currentFloor, clickPoint.x, clickPoint.y, target);
                if (result.path) {
                    pathLine = result.path;
                    document.getElementById("pathInfo").style.display = "block";
                    document.getElementById("pathInfo").textContent = (result.message ? result.message + " | " : "") + result.directions;
                    draw();
                }
            }
            return;
        }
    }

    // 走廊点击（设置起点）
    if (currentFloor === "F1" || currentFloor === "F2") {
        const resp = await fetch(`/api/check_path?floor=${currentFloor}&x=${Math.round(cx)}&y=${Math.round(cy)}`);
        const data = await resp.json();
        if (data.on_path) {
            clickPoint = { x: Math.round(cx), y: Math.round(cy) };
            draw();
        }
    }
});

// ==================== 商铺详情 ====================
async function showDetail(name) {
    currentDetailStore = name;
    const detail = await fetchStoreDetail(name);
    document.getElementById("detailName").textContent = detail.name;
    document.getElementById("detailMeta").textContent =
        `${detail.floor} | ${detail.category} | Location: ${detail.x}, ${detail.y}`;
    document.getElementById("detailDesc").textContent = detail.desc;
    document.getElementById("starRating").textContent = detail.rating;
    document.getElementById("starFill").style.width = (detail.rating / 5.0 * 100) + "%";

    const commentsDiv = document.getElementById("detailComments");
    commentsDiv.innerHTML = detail.comments.length === 0 ? "<i>No comments yet.</i>" : "";
    detail.comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment";
        div.textContent = `${c.name} [${c.score}] ${c.comment}`;
        commentsDiv.appendChild(div);
    });

    document.getElementById("reviewScore").value = 5.0;
    document.getElementById("reviewScoreLabel").textContent = "5.0";
    document.getElementById("reviewText").value = "";
    document.getElementById("detailOverlay").style.display = "block";
    draw();
}

document.querySelector("#detailOverlay .close").addEventListener("click", () => {
    document.getElementById("detailOverlay").style.display = "none";
    currentDetailStore = "";
    draw();
});

document.getElementById("reviewScore").addEventListener("input", function() {
    document.getElementById("reviewScoreLabel").textContent = parseFloat(this.value).toFixed(1);
});

document.getElementById("submitReview").addEventListener("click", async () => {
    const score = parseFloat(document.getElementById("reviewScore").value);
    const comment = document.getElementById("reviewText").value.trim();
    if (!currentDetailStore || !comment) return;
    await addComment(currentDetailStore, score, comment);
    showDetail(currentDetailStore);
});

// ==================== 搜索 ====================
document.querySelector("#searchOverlay .close").addEventListener("click", () => {
    document.getElementById("searchOverlay").style.display = "none";
});

document.getElementById("searchInput").addEventListener("input", async function() {
    const results = await searchStores(this.value);
    const div = document.getElementById("searchResults");
    div.innerHTML = results.map(r =>
        `<div class="item" data-name="${r.name}">${r.name} (${r.floor} | ${r.category} | ${r.rating})</div>`
    ).join("");
});

document.getElementById("searchResults").addEventListener("click", e => {
    const item = e.target.closest(".item");
    if (!item) return;
    const name = item.dataset.name;
    document.getElementById("searchOverlay").style.display = "none";
    const store = currentStores.find(s => s.name === name);
    if (store) { currentFloor = store.floor; clickPoint = null; pathLine = null; document.getElementById("pathInfo").style.display="none"; }
    refreshAndDraw().then(() => showDetail(name));
});

// ==================== 分类排序 ====================
function openSortOverlay() {
    document.getElementById("sortOverlay").style.display = "block";
    const catBtns = document.querySelector("#sortOverlay .catBtns");
    catBtns.innerHTML = CATEGORIES.map(c =>
        `<button data-cat="${c}">${c}</button>`
    ).join("");
    showCategoryStores(CATEGORIES[0]);
}

document.querySelector("#sortOverlay .close").addEventListener("click", () => {
    document.getElementById("sortOverlay").style.display = "none";
});

document.querySelector("#sortOverlay .catBtns").addEventListener("click", e => {
    if (e.target.tagName === "BUTTON") showCategoryStores(e.target.dataset.cat);
});

function showCategoryStores(cat) {
    const stores = currentStores.filter(s => s.category === cat);
    const div = document.getElementById("sortResults");
    div.innerHTML = stores.map(s =>
        `<div class="item" data-name="${s.name}">${s.name} (${s.floor} | rating: ${s.rating})</div>`
    ).join("");
}

document.getElementById("sortResults").addEventListener("click", e => {
    const item = e.target.closest(".item");
    if (!item) return;
    const name = item.dataset.name;
    document.getElementById("sortOverlay").style.display = "none";
    const store = currentStores.find(s => s.name === name);
    if (store) { currentFloor = store.floor; clickPoint = null; pathLine = null; document.getElementById("pathInfo").style.display="none"; }
    refreshAndDraw().then(() => showDetail(name));
});

// ==================== 初始化 ====================
fetchStores().then(() => draw());
</script>
